<section class="section" id="faq">
  <div class="container-x grid gap-12 lg:grid-cols-[0.8fr_1.2fr] lg:gap-16">
    <div class="lg:sticky lg:top-32 lg:self-start" appReveal>
      <span class="eyebrow">FAQ</span>
      <h2 class="section-title">Questions?<br><span class="highlight">Answers.</span></h2>
      <p class="section-lead">
        Everything you need to know before joining. Can’t find your answer?
        <a [href]="'mailto:' + email" class="text-brand-cream underline decoration-brand-blue/60 underline-offset-4 hover:decoration-brand-blue">Email us</a>.
      </p>
    </div>

    <div class="space-y-3">
      @for (faq of faqs; track faq.question; let i = $index) {
        <details name="faq" class="group rounded-2xl border border-white/[0.08] bg-white/[0.02] transition-colors duration-300 hover:border-white/15"
                 [open]="i === 0" [appReveal]="i * 60">
          <summary class="flex cursor-pointer items-center justify-between gap-6 px-6 py-5 text-left font-display text-base font-medium text-brand-cream sm:text-lg">
            {{ faq.question }}
            <span class="faq-toggle grid h-8 w-8 shrink-0 place-items-center rounded-full border border-white/10 text-slate-300 transition-transform duration-300">
              <app-icon name="plus" class="h-4 w-4" />
            </span>
          </summary>
          <p class="px-6 pb-6 leading-relaxed text-slate-400">{{ faq.answer }}</p>
        </details>
      }
    </div>
  </div>
</section>
